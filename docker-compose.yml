services:
  postgres:
    image: postgres:17
    container_name: accrualflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: accrualflow
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: accrualflow_db
    ports:
      - "5433:5432"
    volumes:
      - accrualflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accrualflow -d accrualflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  accrualflow_pgdata:
